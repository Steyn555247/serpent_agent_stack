# Destructive operations gate
#
# Any path or command that matches a pattern below is "destructive" — i.e.
# requires explicit human confirmation, never autonomous execution.
#
# Used by: agent_stack/tools/safety_check.py
#
# Pattern syntax:
#   - paths:    fnmatch glob, evaluated against repo-relative POSIX paths
#   - commands: regex, evaluated against the command string

version: 1

# Files whose modification is destructive (safety-critical). Touching these triggers
# both the destructive-op flow AND mandatory safety-gate review.
safety_critical_paths:
  # E-STOP rebuild landed 2026-04-24 (see ESTOP_REBUILD_PLAN.md v2.1).
  # Safety-critical paths cover HMAC framing, the two E-STOP authorities,
  # both Pi-side watchdogs, command executor / forwarders, control server,
  # bridge coordinators, telemetry receivers, firmware, systemd units, and
  # deploy/PSK scripts.
  - "pi_halow_bridge/PI-HALOW-BRIDGE/common/constants.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/common/framing.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/robot_pi/actuators/actuator_controller.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/robot_pi/core/command_executor.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/robot_pi/core/watchdog_monitor.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/robot_pi/core/bridge_coordinator.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/robot_pi/control/control_server.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/robot_pi/sensors/sensor_reader.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/base_pi/winch/winch_controller.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/base_pi/control/control_forwarder.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/base_pi/telemetry/telemetry_receiver.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/base_pi/core/base_watchdog.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/base_pi/core/bridge_coordinator.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/base_pi/core/backend_client.py"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/firmware/**"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/**/*.service"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/scripts/pi_install.sh"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/scripts/pi_enable_services.sh"
  - "pi_halow_bridge/PI-HALOW-BRIDGE/scripts/generate_psk.py"

# Operational state files that must never be edited from an agent (regenerated by tooling).
generated_paths:
  - "agent_stack/repo_map.json"
  - "agent_stack/repo_map.md"
  - "agent_stack/.runtime/**"
  - "**/__pycache__/**"
  - "**/build/**"
  - "**/.dart_tool/**"

# Patterns of files that must never be committed.
never_commit_paths:
  - "**/*.psk"
  - "**/*.psk.*"
  - "**/.psk*"
  - "**/secrets*.env"
  - "**/.env"
  - "**/credentials.json"

# Commands that are destructive — require explicit human OK.
destructive_commands:
  # Firmware flashing
  - "(?i)\\bpio\\b.*-t\\s+upload"
  - "(?i)\\barduino-cli\\b.*\\bupload\\b"
  - "(?i)\\besptool(\\.py)?\\b"
  - "(?i)\\bavrdude\\b"
  - "(?i)\\bopenocd\\b"

  # Pi deployment / system mutation
  - "(?i)\\bsystemctl\\s+(start|stop|restart|enable|disable|mask|unmask)\\b"
  - "(?i)\\bsudo\\s+bash\\s+.*setup_.*\\.sh"
  - "(?i)\\bsudo\\s+bash\\s+.*pi_install\\.sh"
  - "(?i)\\bsudo\\s+bash\\s+.*pi_enable_services\\.sh"
  - "(?i)\\brsync\\b.*pi@"
  - "(?i)\\bscp\\b.*pi@"
  - "(?i)\\bssh\\s+.*pi@.*\\b(rm|reboot|shutdown|halt)\\b"
  - "(?i)\\badb\\s+(install|push|shell\\s+rm)\\b"

  # Destructive git
  - "(?i)\\bgit\\s+push\\s+.*--force\\b"
  - "(?i)\\bgit\\s+push\\s+.*-f\\b"
  - "(?i)\\bgit\\s+reset\\s+--hard\\b"
  - "(?i)\\bgit\\s+clean\\s+-[fdx]+\\b"
  - "(?i)\\bgit\\s+branch\\s+-D\\b"
  - "(?i)\\bgit\\s+checkout\\s+--\\s+\\."

  # Filesystem destruction
  - "(?i)\\brm\\s+-rf\\b"
  - "(?i)\\bmkfs\\b"
  - "(?i)\\bdd\\s+if=.*\\bof=/dev/"

  # Network reconfig
  - "(?i)\\biw\\s+.*\\b(set|del)\\b"
  - "(?i)\\bip\\s+(addr|link|route)\\s+(add|del|change|flush)\\b"
  - "(?i)\\bnmcli\\s+.*\\b(modify|delete|add)\\b"

# Commands that are safe but worth flagging (informational; not blocking).
sensitive_commands:
  - "(?i)\\bgit\\s+commit\\b"
  - "(?i)\\bgit\\s+push\\b"
  - "(?i)\\bpip\\s+install\\b"
  - "(?i)\\bflutter\\s+pub\\s+upgrade\\b"
